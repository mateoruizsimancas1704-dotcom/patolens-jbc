name: Compilar APK e IPA
on: [workflow_dispatch, push]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Preparar www
        run: |
          mkdir -p www/lib/leaflet assets
          cp *.html *.css *.js *.png *.webmanifest www/
          cp node_modules/jspdf/dist/jspdf.umd.min.js node_modules/pdfjs-dist/build/pdf.min.js node_modules/pdfjs-dist/build/pdf.worker.min.js www/lib/
          cp node_modules/leaflet/dist/leaflet.js node_modules/leaflet/dist/leaflet.css www/lib/leaflet/
          cp -r node_modules/leaflet/dist/images www/lib/leaflet/
          cp icon-1024.png assets/icon-only.png
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff'
        continue-on-error: true
      - name: Permisos
        run: sed -i 's#</manifest>#<uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/></manifest>#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PatoLens-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Preparar www
        run: |
          mkdir -p www/lib/leaflet assets
          cp *.html *.css *.js *.png *.webmanifest www/
          cp node_modules/jspdf/dist/jspdf.umd.min.js node_modules/pdfjs-dist/build/pdf.min.js node_modules/pdfjs-dist/build/pdf.worker.min.js www/lib/
          cp node_modules/leaflet/dist/leaflet.js node_modules/leaflet/dist/leaflet.css www/lib/leaflet/
          cp -r node_modules/leaflet/dist/images www/lib/leaflet/
          cp icon-1024.png assets/icon-only.png
      - run: npx cap add ios
      - run: npx @capacitor/assets generate --ios --iconBackgroundColor '#ffffff'
        continue-on-error: true
      - name: Permisos
        run: |
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string PatoLens usa la camara para fotografiar lesiones" $P
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string PatoLens permite elegir fotos y planos" $P
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string PatoLens registra la ubicacion de la lesion" $P
      - run: npx cap sync ios
      - name: Compilar sin firmar
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then T="-workspace App.xcworkspace"; else T="-project App.xcodeproj"; fi
          xcodebuild $T -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir Payload && cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr PatoLens.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PatoLens-IPA
          path: ios/App/PatoLens.ipa
